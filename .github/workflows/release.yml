name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          echo "tag=$TAG versionName=$NAME"
          test "$TAG" = "$NAME"

      - name: Require signing secrets
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

      - name: Decode keystore
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Name APK
        run: |
          NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          mkdir -p dist
          mv app/build/outputs/apk/release/app-release.apk "dist/immersive-reader-${NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/immersive-reader-*.apk
